<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ProcureSmart Health workflow</title>
  <desc id="desc">A clinical need becomes editable criteria, a shortlist and a clinician decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#c8dcff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173369" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="210" fill="none" stroke="#1257d5" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="90" cy="650" r="180" fill="#1257d5" fill-opacity=".08"/>
  <text x="75" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1257d5">PROCURESMART HEALTH</text>
  <text x="75" y="140" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#092765">From need to evidence-ready shortlist</text>
  <g filter="url(#shadow)">
    <rect x="75" y="215" width="290" height="280" rx="14" fill="#fff"/>
    <rect x="455" y="185" width="290" height="340" rx="14" fill="#fff"/>
    <rect x="835" y="215" width="290" height="280" rx="14" fill="#092765"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="105" y="260" font-size="14" font-weight="700" fill="#1257d5">01 / CLINICAL NEED</text>
    <text x="105" y="310" font-size="20" font-weight="700" fill="#17213a">Describe the need</text>
    <rect x="105" y="335" width="230" height="95" rx="8" fill="#f3f7ff" stroke="#b8cae7"/>
    <line x1="125" y1="362" x2="300" y2="362" stroke="#8da3c3" stroke-width="8" stroke-linecap="round"/>
    <line x1="125" y1="390" x2="268" y2="390" stroke="#c2cfe1" stroke-width="8" stroke-linecap="round"/>
    <text x="485" y="230" font-size="14" font-weight="700" fill="#1257d5">02 / EDITABLE CRITERIA</text>
    <text x="485" y="280" font-size="20" font-weight="700" fill="#17213a">Confirm priorities</text>
    <rect x="485" y="310" width="230" height="48" rx="24" fill="#dbe8ff"/><text x="510" y="341" font-size="14" fill="#123a83">Validated accuracy</text>
    <rect x="485" y="370" width="190" height="48" rx="24" fill="#dbe8ff"/><text x="510" y="401" font-size="14" fill="#123a83">Home use</text>
    <rect x="485" y="430" width="205" height="48" rx="24" fill="#dbe8ff"/><text x="510" y="461" font-size="14" fill="#123a83">Easy-cuff fit</text>
    <text x="865" y="260" font-size="14" font-weight="700" fill="#8eb7ff">03 / SHORTLIST</text>
    <text x="865" y="310" font-size="20" font-weight="700" fill="#fff">Clinician reviews</text>
    <rect x="865" y="340" width="230" height="34" rx="5" fill="#fff" fill-opacity=".96"/>
    <rect x="865" y="388" width="230" height="34" rx="5" fill="#fff" fill-opacity=".82"/>
    <rect x="865" y="436" width="230" height="34" rx="5" fill="#fff" fill-opacity=".68"/>
  </g>
  <path d="M385 355h48" stroke="#1257d5" stroke-width="4"/><path d="m425 345 12 10-12 10" fill="none" stroke="#1257d5" stroke-width="4"/>
  <path d="M765 355h48" stroke="#1257d5" stroke-width="4"/><path d="m805 345 12 10-12 10" fill="none" stroke="#1257d5" stroke-width="4"/>
  <text x="600" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17213a">AI structures the search · Clinicians make the decision</text>
</svg>
