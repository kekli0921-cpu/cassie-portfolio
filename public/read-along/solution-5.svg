<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Make listening and position visible</title>
  <desc id="desc">A system visibility concept for Google Read Along showing listening state, return position, and the difference between pronunciation review and repositioning.</desc>
  <defs>
    <linearGradient id="coolBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5faf7"/>
      <stop offset="1" stop-color="#eef5f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#62736a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#coolBg)"/>
  <text x="80" y="74" fill="#e9832f" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">SOLUTION 05 · SYSTEM VISIBILITY</text>
  <text x="80" y="145" fill="#18211d" font-family="Arial, sans-serif" font-size="54" font-weight="700">Make listening and position visible</text>
  <text x="80" y="190" fill="#68716c" font-family="Arial, sans-serif" font-size="24">Show what the system is doing, remember progress, and separate review from navigation.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="460" height="500" rx="28" fill="#fff" stroke="#e0ebe5" stroke-width="2"/>
    <rect x="570" y="250" width="460" height="500" rx="28" fill="#fff" stroke="#e0ebe5" stroke-width="2"/>
    <rect x="1070" y="250" width="460" height="500" rx="28" fill="#fff" stroke="#e0ebe5" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="105" y="302" fill="#e9832f" font-size="17" font-weight="700" letter-spacing="1.5">01 · LISTENING STATE</text>
    <text x="105" y="350" fill="#18211d" font-size="31" font-weight="700">Silence becomes legible</text>
    <text x="105" y="390" fill="#68716c" font-size="20">Live feedback confirms that the system</text>
    <text x="105" y="418" fill="#68716c" font-size="20">is listening before it pauses.</text>

    <rect x="105" y="470" width="390" height="94" rx="20" fill="#eff8f2"/>
    <circle cx="145" cy="517" r="22" fill="#1fa66b"/>
    <path d="M135 520 q10-24 20 0 q10 24 20 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="185" y="507" fill="#18211d" font-size="18" font-weight="700">Listening</text>
    <text x="185" y="534" fill="#68716c" font-size="16">Voice activity is visible in real time</text>

    <path d="M300 583 V616" stroke="#bac7c0" stroke-width="3" stroke-linecap="round"/>
    <text x="320" y="606" fill="#89938e" font-size="14">10 sec silence</text>
    <rect x="105" y="628" width="390" height="76" rx="20" fill="#f3f4f3"/>
    <circle cx="145" cy="666" r="18" fill="#909793"/>
    <rect x="138" y="658" width="5" height="17" rx="2.5" fill="#fff"/>
    <rect x="147" y="658" width="5" height="17" rx="2.5" fill="#fff"/>
    <text x="181" y="659" fill="#18211d" font-size="17" font-weight="700">Paused</text>
    <text x="181" y="684" fill="#68716c" font-size="15">Tap the mic to resume</text>

    <text x="605" y="302" fill="#e9832f" font-size="17" font-weight="700" letter-spacing="1.5">02 · RETURNING TO A STORY</text>
    <text x="605" y="350" fill="#18211d" font-size="31" font-weight="700">Progress has a memory</text>
    <text x="605" y="390" fill="#68716c" font-size="20">Reopening a story offers an explicit</text>
    <text x="605" y="418" fill="#68716c" font-size="20">choice instead of guessing.</text>

    <rect x="605" y="470" width="390" height="234" rx="22" fill="#f7f8f7" stroke="#e5e9e7"/>
    <text x="638" y="514" fill="#18211d" font-size="17" font-weight="700">Welcome back</text>
    <text x="638" y="546" fill="#68716c" font-size="16">You stopped on page 6 of 10</text>
    <rect x="638" y="573" width="324" height="9" rx="4.5" fill="#e0e5e2"/>
    <rect x="638" y="573" width="194" height="9" rx="4.5" fill="#1fa66b"/>
    <rect x="638" y="616" width="152" height="47" rx="23.5" fill="#1fa66b"/>
    <text x="714" y="646" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Resume here</text>
    <rect x="808" y="616" width="154" height="47" rx="23.5" fill="#fff" stroke="#cfd8d3"/>
    <text x="885" y="646" text-anchor="middle" fill="#68716c" font-size="16" font-weight="700">Restart story</text>

    <text x="1105" y="302" fill="#e9832f" font-size="17" font-weight="700" letter-spacing="1.5">03 · REVIEW ≠ REPOSITION</text>
    <text x="1105" y="350" fill="#18211d" font-size="31" font-weight="700">One word, two intentions</text>
    <text x="1105" y="390" fill="#68716c" font-size="20">The first tap reviews pronunciation.</text>
    <text x="1105" y="418" fill="#68716c" font-size="20">A second tap deliberately moves position.</text>

    <rect x="1105" y="470" width="390" height="94" rx="20" fill="#f5f3fb"/>
    <circle cx="1147" cy="517" r="22" fill="#7f8fd5"/>
    <text x="1147" y="524" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1×</text>
    <text x="1185" y="507" fill="#18211d" font-size="18" font-weight="700">Pronunciation only</text>
    <text x="1185" y="534" fill="#68716c" font-size="16">Review without moving the story</text>

    <path d="M1300 583 V616" stroke="#bac7c0" stroke-width="3" stroke-linecap="round"/>
    <text x="1320" y="606" fill="#89938e" font-size="14">second tap within 2 sec</text>
    <rect x="1105" y="628" width="390" height="76" rx="20" fill="#fff2e6"/>
    <circle cx="1147" cy="666" r="18" fill="#e9832f"/>
    <path d="M1138 666 H1156 M1149 658 L1157 666 1149 674" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1183" y="659" fill="#18211d" font-size="17" font-weight="700">Set new start point</text>
    <text x="1183" y="684" fill="#68716c" font-size="15">Reposition only after confirmation</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="322" y="800" width="250" height="52" rx="26" fill="#e8f4ed"/>
    <circle cx="355" cy="826" r="8" fill="#1fa66b"/>
    <text x="378" y="833" fill="#18211d" font-size="18" font-weight="700">Visible state</text>

    <rect x="675" y="800" width="250" height="52" rx="26" fill="#fff0e1"/>
    <circle cx="708" cy="826" r="8" fill="#e9832f"/>
    <text x="731" y="833" fill="#18211d" font-size="18" font-weight="700">Explicit choice</text>

    <rect x="1028" y="800" width="300" height="52" rx="26" fill="#efeff8"/>
    <circle cx="1061" cy="826" r="8" fill="#7f8fd5"/>
    <text x="1084" y="833" fill="#18211d" font-size="18" font-weight="700">No accidental repositioning</text>
  </g>
</svg>
